[project]
name = "python-mcp-excel"
description = "MCP Excel server"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "basedpyright>=1.39.6",
    "fastapi>=0.136.3",
    "mcp>=1.27.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pandas-stubs~=3.0.3",
    "ruff>=0.15.15",
    "uvicorn>=0.49.0",
]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = true
reportUnusedVariable = true
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear
    "UP",  # pyupgrade (Python 3.14 aware)
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
